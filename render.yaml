services:
  - type: web
    name: stock-qr-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-qr-db
          property: connectionString
databases:
  - name: stock-qr-db
    databaseName: stockqr
    user: stockqr_user
    plan: free
